services:
  - type: web
    name: lbr1-vf
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker + หลาย thread: SSE และแคชข้อมูลอยู่ใน process เดียวกัน
    startCommand: gunicorn app:app --workers 1 --threads 50 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APPS_SCRIPT_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
