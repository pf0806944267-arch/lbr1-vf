services:
  - type: web
    name: village-fund-2569
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PORT
        value: 10000
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false
